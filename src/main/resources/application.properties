spring.application.name=webex

relay.transport.port=5555
relay.transport.max-active-connections=1000
relay.transport.max-frame-bytes=70000
relay.transport.write-queue-capacity=256

relay.storage.max-mailbox-size=100

relay.messaging.max-payload-bytes=65536
relay.messaging.dedupe-window-size=1000

relay.broker.max-queue-size=10000

spring.datasource.url=jdbc:h2:mem:webex;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
